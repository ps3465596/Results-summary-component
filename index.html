<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Results summary component</title>
</head>
<body>
  <main class="flex-box main">
    <div class="div-1 blue result flex-item">
      <p class="p-1 center"> Your Result</p>
      <div class="score circle center">
        <h1>76</h1>
        <p class="of">of 100 </p>
      </div>
      <h3>Great</h3>
      <p class="p-2">You scored higher than 65% of the people who have taken these tests.</p>
    </div>
    <div class="div-2 white summary flex-item">
      <h3>Summary</h3>
      <!-- box-one -->
      <div class="box-1 box pink reaction">
        <img src="file:///C:/Users/intel/Desktop/results-summary-component-main/assets/images/icon-reaction.svg" class="inline left">
        <p class="inline left">Reaction</p>
        <p class="right inline ">
          <span class=bold>80 </span>
          /100
        </p>
      </div>
      <!-- box-two -->
      <div class="box-2 box orange memory">
        <img src="file:///C:/Users/intel/Desktop/results-summary-component-main/assets/images/icon-memory.svg" class="inline left">
        <p class="inline left">Memory</p>
          <p class="right inline">
            <span class="bold">92</span>
            /100
          </p>
      </div>
      <!-- box-three -->
      <div class="box-3 box green verbal" >
        <img src="file:///C:/Users/intel/Desktop/results-summary-component-main/assets/images/icon-verbal.svg" class="inline left">
        <p class="inline left">Verbal
          <p class="right inline">
            <span class="bold">61</span> 
            /100
          </p>
      </div>
      <!-- box-four -->
      <div class="box-4 box blue visual" >
        <img src="file:///C:/Users/intel/Desktop/results-summary-component-main/assets/images/icon-visual.svg" class="inline left">
        <p class="inline left">Visual </p>
          <p class="right inline">
            <span class="bold">72 </span>
            /100
          </p>
      </div>
      <button>Continue</button>
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">PANKAJ SAINI</a>.
  </footer>
</body>
</html>
